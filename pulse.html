<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Absurdly Human</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--navy:#0D1B3D;--blue:#1E4D8C;--blue-soft:#e9eef7;--line:#e4e8f0;--muted:#5b6577}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:#fff;color:var(--navy);font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
h1,h2,h3,.brandfont{font-family:'Poppins','Inter',sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:22px 20px 80px}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.top img{height:38px}.top .step{font-size:13px;color:var(--muted);font-weight:500}
.progress{height:8px;background:var(--blue-soft);border-radius:99px;overflow:hidden;margin:6px 0 26px}
.progress>i{display:block;height:100%;background:var(--blue);width:0;border-radius:99px;transition:width .35s ease}
.card{border:1px solid var(--line);border-radius:16px;padding:22px;margin:0 0 16px;background:#fff}
.btn{font-family:'Poppins',sans-serif;font-weight:600;font-size:16px;border:none;border-radius:12px;padding:14px 26px;cursor:pointer;transition:.15s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:#173d70}
.btn-ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}.btn-ghost:hover{background:var(--blue-soft)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px}
.hero{text-align:center;padding:26px 10px}.hero img{height:120px;margin-bottom:18px}
.hero h1{font-size:38px;margin:.1em 0;letter-spacing:.5px}
.hero .tag{color:var(--blue);font-weight:600;font-size:18px;margin-bottom:18px}
.hero p{color:var(--muted);max-width:540px;margin:0 auto 22px;font-size:16px}
.facts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:0 0 26px}
.fact{background:var(--blue-soft);border-radius:12px;padding:12px 18px;font-weight:600;font-size:14px}
.priv{font-size:13px;color:var(--muted);margin-top:18px}
.pchip{display:inline-flex;align-items:center;gap:9px;font-family:'Poppins';font-weight:600;font-size:14px;color:#fff;padding:7px 14px;border-radius:99px}
.pdot{width:9px;height:9px;border-radius:50%;background:#fff;opacity:.9}
.ph{margin:16px 0 4px;font-size:24px}.pdesc{color:var(--muted);margin:0 0 18px;font-size:15px}
.q{padding:18px 0;border-top:1px solid var(--line)}.q:first-of-type{border-top:none}
.qtext{font-weight:500;margin:0 0 14px;font-size:16px}
.scale{display:flex;gap:8px}
.opt{flex:1;min-width:0;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 0;font-family:'Poppins';font-weight:600;font-size:17px;color:var(--navy);cursor:pointer;transition:.12s;text-align:center}
.opt:hover{border-color:var(--blue)}.opt.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.scale-lbl{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:7px}
.missing{color:#922B21;font-weight:600;font-size:14px;margin-top:14px;display:none}
.idx{text-align:center;padding:8px 0 4px}
.idx .lvl{font-family:'Poppins';font-weight:700;font-size:15px;letter-spacing:1.2px;text-transform:uppercase;padding:6px 16px;border-radius:99px;color:#fff;display:inline-block;margin-bottom:12px}
.idx h2{font-size:28px;margin:6px 0 2px}.idx .sub{color:var(--muted);font-size:15px}
.radar-wrap{max-width:440px;margin:6px auto 0}
.bar{margin:14px 0}.bar .r{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.bar .nm{font-weight:600;font-size:15px}
.bar .bd{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#fff;padding:3px 9px;border-radius:99px;white-space:nowrap}
.track{height:12px;background:#eef1f6;border-radius:99px;overflow:hidden}.track>i{display:block;height:100%;border-radius:99px}
.reco{border:2px solid var(--blue);border-radius:16px;padding:24px;background:linear-gradient(180deg,#f6f9ff,#fff)}
.reco .kick{color:var(--blue);font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase}
.reco h3{font-size:22px;margin:8px 0 6px}.reco p{color:#33405a;font-size:15px;margin:0 0 14px}
.freebox{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:14px 16px;font-size:14px;color:#33405a;margin:14px 0}.freebox b{color:var(--navy)}
.tkrow{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.email{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.email input{flex:1;min-width:200px;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:15px;font-family:'Inter'}
.sec2{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:16px 0 0;background:#fafbfe}
.sec2 .kick{color:var(--muted);font-weight:700;font-size:12px;letter-spacing:.8px;text-transform:uppercase}
.sec2 .ln{font-size:15px;margin-top:4px}.sec2 a{color:var(--blue);font-weight:600;text-decoration:none;white-space:nowrap}
.teaser{text-align:center;color:var(--muted);font-size:13px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.foot{text-align:center;color:#9aa4b6;font-size:12px;margin-top:34px}
.smallmark{height:20px;vertical-align:middle;opacity:.7;margin-right:6px}
@media(max-width:560px){.hero h1{font-size:30px}.opt{font-size:15px;padding:11px 0}.scale{gap:6px}}
.embedded .hero>a{display:none}
.embedded .foot{display:none}
.embedded .hero{padding-top:8px}
</style>
<script>if(window.self!==window.top){document.documentElement.classList.add('embedded');}</script>
</head>

 h+=`</div><div class="missing" id="miss">${T(U.miss,{k:qs.length})}</div>
 <div class="nav"><button class="btn btn-ghost" onclick="back()">${si===0?U.back_first:U.back}</button>
 <button class="btn btn-primary" onclick="next()">${si===NS-1?U.last_next:U.next}</button></div>`;
 app.innerHTML=h;}
function results(){
 const scored=DIMS.map(d=>({d,s:dimScore(d.id),b:bandOf(dimScore(d.id))}));
 const sorted=[...scored].sort((a,b)=>b.s-a.s);
 const primary=sorted[0], secondary=sorted[1]; window._focus=primary.d.name;
 let h=topbar(U.res_step);
 if(CFG.show_overall){const ov=overall();const ob=bandOf(ov);
  h+=`<div class="idx"><span class="lvl" style="background:${ob.hex}">${ob.name}</span>
  <h2>${U.idx_title}</h2><div class="sub">${T(U.idx_sub,{s:ov.toFixed(2)})}</div></div>`;}
 // radar
 h+=`<div class="card"><h3 style="margin:2px 0 4px;font-size:18px">${U.radar_title}</h3>
 <p style="color:var(--muted);font-size:14px;margin:0 0 6px">${U.radar_note}</p>
 <div class="radar-wrap"><canvas id="radar" height="300"></canvas></div></div>`;
 // bars
 h+=`<div class="card"><h3 style="margin:2px 0 4px;font-size:18px">${U.bars_title}</h3>
 <p style="color:var(--muted);font-size:14px;margin:0 0 6px">${U.bars_sub}</p><div class="bars">`;
 sorted.forEach(o=>{const w=Math.max(Math.round((o.s-1)/4*100),4);
  h+=`<div class="bar"><div class="r"><span class="nm" style="color:${o.d.color}">${o.d.name}</span>
  <span class="bd" style="background:${o.b.hex}">${o.b.name} · ${o.s.toFixed(2)}</span></div>
  <div class="track"><i style="width:${w}%;background:${o.b.hex}"></i></div></div>`;});
 h+=`</div></div>`;
 // primary recommendation
 const pr=primary.d.rec, cta=pr[CFG.reco_cta_key];
 const lowShow=(CFG.mode==='worker' && primary.s<=2.0 && U.low_msg);
 h+=`<div class="reco"><div class="kick">${U.reco_kick}</div>
 <h3>${T(U.reco_h,{name:primary.d.name})}</h3>`;
 h+= lowShow ? `<p>${U.low_msg}</p>` : `<p>${T(U.reco_p,{name:primary.d.name,lvl:primary.b.name,s:primary.s.toFixed(2),note:primary.b.note})}</p>`;
 if(pr.free){h+=`<div class="freebox"><b>${U.free_label}</b><br>${pr.free}</div>`;}
 h+=`<p style="margin:6px 0 14px">${U.reco_intro}</p>
 <div class="tkrow"><div><b style="font-size:17px">${pr.name}</b><br><span style="color:var(--muted);font-size:14px">${pr.desc}</span></div>
 <a class="btn btn-primary" href="${pr.link}" target="_blank" rel="noopener noreferrer" style="text-decoration:none;white-space:nowrap">${cta}</a></div>
 <div class="email"><input id="mail" type="email" placeholder="${U.email_ph}">
 <button class="btn btn-ghost" onclick="capture()">${U.email_btn}</button></div>
 <div id="mailok" style="color:#1B6B3A;font-weight:600;font-size:14px;margin-top:8px;display:none">${U.email_ok}</div></div>`;
 // secondary
 const sr=secondary.d.rec;
 h+=`<div class="sec2"><div class="kick">${U.sec_kick}</div>
 <div class="ln">${T(U.sec_line,{name:secondary.d.name,lvl:secondary.b.name,s:secondary.s.toFixed(2)})}
 <b>${sr.name}</b> · <a href="${sr.link}" target="_blank" rel="noopener noreferrer">${sr[CFG.reco_cta_key]}</a></div></div>`;
 h+=`<div class="teaser">${U.teaser}</div>
 <div class="nav" style="margin-top:22px"><button class="btn btn-ghost" onclick="restart()">${U.restart}</button><span></span></div>
 <div class="foot"><img class="smallmark" src="${CFG.mark}">${U.foot}</div>`;
 app.innerHTML=h; drawRadar();}
function drawRadar(){if(!window.Chart)return;const el=document.getElementById('radar');if(!el)return;
 new Chart(el,{type:'radar',data:{labels:DIMS.map(d=>d.short||d.name),
  datasets:[{label:U.radar_label,data:DIMS.map(d=>dimScore(d.id)),
   fill:true,backgroundColor:'rgba(30,77,140,.15)',borderColor:'#1E4D8C',borderWidth:2,
   pointBackgroundColor:'#1E4D8C',pointRadius:3}]},
  options:{responsive:true,maintainAspectRatio:false,
   scales:{r:{min:0,max:5,ticks:{stepSize:1,display:false},pointLabels:{font:{size:11,family:'Inter'},color:'#0D1B3D'},
    grid:{color:'#e4e8f0'},angleLines:{color:'#e4e8f0'}}},plugins:{legend:{display:false}}}});}
function go(i){screen=i;render();}
function pick(qid,v){answers[qid]=v;const el=document.querySelector(`[data-q="${qid}"]`);
 if(el)el.querySelectorAll('.opt').forEach((b,i)=>b.classList.toggle('sel',i+1===v));
 const m=document.getElementById('miss');if(m)m.style.display='none';
 const pf=document.querySelector('.progress>i');if(pf)pf.style.width=Math.round(nAns()/NQ*100)+'%';}
function allAns(si){return secQs(si).every(q=>answers[q.id]!=null);}
function next(){const si=screen;
 if(!allAns(si)){const m=document.getElementById('miss');if(m)m.style.display='block';
  const f=secQs(si).find(q=>answers[q.id]==null);const el=document.querySelector(`[data-q="${f.id}"]`);
  if(el)el.scrollIntoView({behavior:'smooth',block:'center'});return;}
 screen=(si===NS-1)?'results':si+1;render();}
function back(){screen=(screen===0)?'welcome':screen-1;render();}
function restart(){for(const k in answers)delete answers[k];screen='welcome';render();}
function capture(){var m=document.getElementById('mail');var ok=document.getElementById('mailok');if(!m||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m.value)){return;}m.disabled=true;var btn=m.nextElementSibling;if(btn)btn.disabled=true;fetch('/api/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:m.value,source:CFG.source,focus:window._focus||''})}).then(function(r){ok.textContent=r.ok?U.email_ok:U.email_err;ok.style.color=r.ok?'#1B6B3A':'#922B21';ok.style.display='block';}).catch(function(){ok.textContent=U.email_err;ok.style.color='#922B21';ok.style.display='block';});}
render();
</script>
</body>
</html>
