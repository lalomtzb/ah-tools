<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Absurdly Human</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--navy:#0D1B3D;--blue:#1E4D8C;--blue-soft:#e9eef7;--line:#e4e8f0;--muted:#5b6577}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:#fff;color:var(--navy);font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
h1,h2,h3,.brandfont{font-family:'Poppins','Inter',sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:22px 20px 80px}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.top img{height:38px}.top .step{font-size:13px;color:var(--muted);font-weight:500}
.progress{height:8px;background:var(--blue-soft);border-radius:99px;overflow:hidden;margin:6px 0 26px}
.progress>i{display:block;height:100%;background:var(--blue);width:0;border-radius:99px;transition:width .35s ease}
.card{border:1px solid var(--line);border-radius:16px;padding:22px;margin:0 0 16px;background:#fff}
.btn{font-family:'Poppins',sans-serif;font-weight:600;font-size:16px;border:none;border-radius:12px;padding:14px 26px;cursor:pointer;transition:.15s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:#173d70}
.btn-ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}.btn-ghost:hover{background:var(--blue-soft)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px}
.hero{text-align:center;padding:26px 10px}.hero img{height:120px;margin-bottom:18px}
.hero h1{font-size:36px;margin:.1em 0;letter-spacing:.3px}
.hero .tag{color:var(--blue);font-weight:600;font-size:18px;margin-bottom:18px}
.hero p{color:var(--muted);max-width:560px;margin:0 auto 22px;font-size:16px}
.facts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:0 0 26px}
.fact{background:var(--blue-soft);border-radius:12px;padding:12px 18px;font-weight:600;font-size:14px}
.priv{font-size:13px;color:var(--muted);margin-top:18px;max-width:520px;margin-left:auto;margin-right:auto}
.pchip{display:inline-flex;align-items:center;gap:9px;font-family:'Poppins';font-weight:600;font-size:14px;color:#fff;padding:7px 14px;border-radius:99px}
.pdot{width:9px;height:9px;border-radius:50%;background:#fff;opacity:.9}
.ph{margin:16px 0 4px;font-size:24px}.pdesc{color:var(--muted);margin:0 0 18px;font-size:15px}
.q{padding:18px 0;border-top:1px solid var(--line)}.q:first-of-type{border-top:none}
.qtext{font-weight:500;margin:0 0 14px;font-size:16px}
.scale{display:flex;gap:8px}
.opt{flex:1;min-width:0;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 0;font-family:'Poppins';font-weight:600;font-size:17px;color:var(--navy);cursor:pointer;transition:.12s;text-align:center}
.opt:hover{border-color:var(--blue)}.opt.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.scale-lbl{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:7px}
.missing{color:#922B21;font-weight:600;font-size:14px;margin-top:14px;display:none}
/* archetype hero */
.arch{border:2px solid var(--blue);border-radius:18px;padding:28px 24px;background:linear-gradient(180deg,#f6f9ff,#fff);text-align:center;margin:0 0 16px}
.arch .kick{color:var(--blue);font-weight:700;font-size:13px;letter-spacing:1.4px}
.arch .emoji{font-size:48px;line-height:1;margin:8px 0 2px}
.arch .nm{font-family:'Poppins';font-weight:700;font-size:30px;margin:4px 0 2px}
.arch .tag{color:var(--blue);font-weight:600;font-size:16px;margin:0 0 12px}
.arch .desc{color:#33405a;font-size:15.5px;max-width:560px;margin:0 auto}
.twocol{display:flex;gap:14px;text-align:left;margin-top:18px;flex-wrap:wrap}
.pbox{flex:1;min-width:220px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 17px}
.pbox h4{margin:0 0 6px;font-size:12.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);font-family:'Poppins'}
.pbox p{margin:0;font-size:14.5px;color:#33405a}
.sec2{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 16px;background:#fafbfe}
.sec2 .kick{color:var(--muted);font-weight:700;font-size:12px;letter-spacing:.8px}
.sec2 .ln{font-size:15px;margin-top:4px}.sec2 b{color:var(--navy)}
/* spectrum bars */
.spec{margin:20px 0}
.spec .ends{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;margin-bottom:7px}
.spec .ends .a{color:var(--navy)}.spec .ends .b{color:var(--blue)}
.spec .rail{position:relative;height:10px;background:linear-gradient(90deg,#e2e9f4,#c9d6ec);border-radius:99px}
.spec .rail .mid{position:absolute;left:50%;top:-4px;width:2px;height:18px;background:#c2cbdb;border-radius:2px}
.spec .rail .dot{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 1px 5px rgba(13,27,61,.3);transform:translate(-50%,-50%)}
.spec .lbl{text-align:center;font-size:12.5px;color:var(--muted);margin-top:9px;font-weight:600}
.radar-wrap{max-width:440px;margin:6px auto 0}
/* cta */
.reco{border:2px solid var(--blue);border-radius:16px;padding:24px;background:linear-gradient(180deg,#f6f9ff,#fff)}
.reco .kick{color:var(--blue);font-weight:700;font-size:13px;letter-spacing:1px}
.reco h3{font-size:21px;margin:8px 0 6px}.reco p{color:#33405a;font-size:15px;margin:0 0 14px}
.tkrow{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.email{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.email input{flex:1;min-width:220px;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:15px;font-family:'Inter'}
.teaser{text-align:center;color:var(--muted);font-size:13px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.foot{text-align:center;color:#9aa4b6;font-size:12px;margin-top:34px}
.smallmark{height:20px;vertical-align:middle;opacity:.7;margin-right:6px}
@media(max-width:560px){.hero h1{font-size:29px}.opt{font-size:15px;padding:11px 0}.scale{gap:6px}.arch .nm{font-size:26px}}
.embedded .hero>a{display:none}.embedded .foot{display:none}.embedded .hero{padding-top:8px}
</style>
<script>if(window.self!==window.top){document.documentElement.classList.add('embedded');}</script>
</head>

AAAkQRuAAAAAAAiCdwAAAAAAEQSuAEAAAAAiCRwAwAAAAAQSeAGAAAAACCSwA0AAAAAQCSBGwAAAACASAI3AAAAAACRBG4AAAAAACIJ3AAAAAAARBK4AQAAAACIJHADAAAAABBJ4AYAAAAAIJLADQAAAABAJIEbAAAAAIBIAjcAAAAAAJEEbgAAAAAAIgncAAAAAABEErgBAAAAAIgkcAMAAAAAEEngBgAAAAAgksANAAAAAEAkgRsAAAAAgEgCNwAAAAAAkQRuAAAAAAAiCdwAAAAAAEQSuAEAAAAAiCRwAwAAAAAQSeAGAAAAACCSwA0AAAAAQCSBGwAAAACASAI3AAAAAACRBG4AAAAAACIJ3AAAAAAARBK4AQAAAACIJHADAAAAABBJ4AYAAAAAIJLADQAAAABAJIEbAAAAAIBIAjcAAAAAAJEEbgAAAAAAIgncAAAAAABEErgBAAAAAIgkcAMAAAAAEEngBgAAAAAgksANAAAAAEAkgRsAAAAAgEgCNwAAAAAAkQRuAAAAAAAiCdwAAAAAAEQSuAEAAAAAiCRwAwAAAAAQSeAGAAAAACCSwA0AAAAAQCSBGwAAAACASAI3AAAAAACRBG4AAAAAACIJ3AAAAAAARBK4AQAAAACIJHADAAAAABBJ4AYAAAAAIJLADQAAAABAJIEbAAAAAIBIAjcAAAAAAJEEbgAAAAAAIgncAAAAAABEErgBAAAAAIgkcAMAAAAAEEngBgAAAAAgksANAAAAAEAkgRsAAAAAgEgCNwAAAAAAkQRuAAAAAAAiCdwAAAAAAEQSuAEAAAAAiCRwAwAAAAAQ6f8B+o9p381MqyIAAAAASUVORK5CYII=", "bal_threshold": 0.34, "strong_threshold": 0.84, "ui": {"hero_title": "Work-Style Profile", "hero_tag": "Find out how you actually work (not how you think you work).", "hero_p": "30 questions, about 4 minutes. Based on the Big Five model of personality, adapted for work. No sign-ups, no accounts, no lectures.", "facts": ["30 questions", "~4 minutes", "5 dimensions", "Grounded in science (Big Five)"], "start": "Start", "priv": "100% anonymous. We don't ask for your name and we don't share your answers. There are no right answers — just your style.", "foot": "Absurdly Human · Corporate Life. Human Reactions.", "sec_of": "Part {n} of {t}", "scale_lo": "Disagree", "scale_hi": "Agree", "miss": "Answer all {k} questions in this part to continue.", "back": "Back", "next": "Next", "last_next": "See my profile", "res_step": "Your profile", "arch_kick": "YOUR ARCHETYPE", "power_h": "Your superpower", "blind_h": "Your blind spot", "sec2_kick": "YOU ALSO LEAN…", "spec_title": "Where you land on each dimension", "spec_sub": "Neither end is better than the other. It's your style, not your grade.", "bal_lbl": "Balanced", "lean_lbl": "Leans {pole}", "strong_lbl": "Strongly {pole}", "radar_title": "Your profile at a glance", "radar_note": "The further out on an axis, the more you lean that way.", "radar_label": "Your style", "cta_kick": "THE NEXT STEP", "cta_h": "Now the interesting question: how does your style clash with your team's?", "cta_p": "This profile is about you. But conflict isn't born from one style — it's born when two styles collide without realizing it. Culture Check measures your team's real climate in minutes.", "cta_name": "Culture Check", "cta_desc": "Free diagnostic of your team's climate.", "cta_btn": "Take the Culture Check", "cta_link": "./pulse-en.html", "email_ph": "Your email to get your profile + tips for your style", "email_btn": "Send it to me", "email_ok": "Done! Check your inbox.", "email_err": "Something went wrong. Try again.", "teaser": "Built on the Big Five model, the most validated personality framework in psychology. This is a self-awareness tool, not a clinical diagnosis.", "restart": "Start over"}, "dims": [{"id": "exec", "poleA": "Planner", "poleB": "Improviser", "short": "Improviser", "archA": {"emoji": "🧭", "name": "The Strategist", "tag": "Plan first, chaos later (hopefully never).", "desc": "Before you lift a finger you've got the map: structure, deadlines, and a plan B just in case.", "power": "You bring order where others see chaos. People trust that things will actually get done.", "blind": "When the plan falls apart, you struggle to let go. Not everything can be foreseen, and rigidity can slow the team down."}, "archB": {"emoji": "🏄", "name": "The Surfer", "tag": "Give me the problem; we'll build the plan on the way.", "desc": "You start and adjust as you go. Last-minute changes don't scare you — they light you up.", "power": "When everything goes sideways, you're in your element. Pure adaptability.", "blind": "Without some structure you leave loose ends. You make the planners on the team nervous."}}, {"id": "energy", "poleA": "Collaborator", "poleB": "Soloist", "short": "Soloist", "archA": {"emoji": "🔌", "name": "The Connector", "tag": "I think best out loud, with people in the room.", "desc": "Your ideas come out when you talk. Brainstorming energizes you and you'd rather solve it live.", "power": "You bring people together and keep the conversation moving. The team feels supported.", "blind": "All that back-and-forth can become noise. You overwhelm the people who need quiet to focus."}, "archB": {"emoji": "🎧", "name": "The Soloist", "tag": "Quiet, focus, and please don't interrupt.", "desc": "You do your best work alone and undisturbed. You'd take a well-crafted message over one more meeting.", "power": "Deep focus. You deliver careful work while others are still in the meeting.", "blind": "Isolate too much and the team loses track of you. Collaboration is part of the job too."}}, {"id": "ideas", "poleA": "Explorer", "poleB": "Pragmatist", "short": "Pragmatist", "archA": {"emoji": "🧪", "name": "The Explorer", "tag": "What if we did it completely differently?", "desc": "Routine bores you. You chase new ideas and you're usually first to try something.", "power": "You're the spark that keeps things from stagnating. You see possibilities where others see 'that's how it's always been'.", "blind": "Not every new idea deserves to ship. Sometimes you chase the shiny thing and leave the important one half-done."}, "archB": {"emoji": "🔨", "name": "The Builder", "tag": "If it works, I don't touch it. And I ship it.", "desc": "You focus on the concrete and on what you know works. Less theory, more finished.", "power": "You get things done. While others dream, you're already building it.", "blind": "Clinging to 'what works' can leave you behind when the world moves. Watch out for killing good ideas out of habit."}}, {"id": "rel", "poleA": "Diplomat", "poleB": "Direct", "short": "Direct", "archA": {"emoji": "🤝", "name": "The Diplomat", "tag": "Anything can be said — with the right delivery.", "desc": "You're careful how you say things and you want everyone on board. Harmony matters to you.", "power": "You defuse tension and build consensus. People feel heard around you.", "blind": "To avoid friction you sometimes swallow what needs saying. Avoided conflict doesn't vanish — it piles up."}, "archB": {"emoji": "🎯", "name": "The Straight-Shooter", "tag": "I'll tell you straight, even if it stings.", "desc": "You say what you think and prefer an open disagreement to an awkward silence.", "power": "With you, people know where they stand. You name the problems others dodge.", "blind": "Unfiltered honesty leaves people bruised. Not everyone takes a blunt truth the same way."}}, {"id": "dec", "poleA": "Analytical", "poleB": "Intuitive", "short": "Intuitive", "archA": {"emoji": "📊", "name": "The Analyst", "tag": "No data on the table, no decision.", "desc": "You compare options, weigh the evidence and take your time. Hunches don't convince you.", "power": "Your decisions hold up to scrutiny. You cut the risk of blowing it on impulse.", "blind": "Over-analysis paralyzes. While you gather the perfect data point, the window closes."}, "archB": {"emoji": "⚡", "name": "The Gut-Caller", "tag": "I feel it before I can explain it.", "desc": "You trust your intuition, decide fast and adjust on the fly.", "power": "You move fast while others are still hesitating. A good nose for reading a situation.", "blind": "Instinct gets it wrong too. With no data at all, sometimes you're just deciding on bias."}}], "sections": [{"chip": "Part 1 of 3", "title": "A bit about how you work", "desc": "Answer based on what you actually do, not what you 'should' do. There are no right answers.", "color": "#1E4D8C"}, {"chip": "Part 2 of 3", "title": "A bit about how you work", "desc": "Answer based on what you actually do, not what you 'should' do. There are no right answers.", "color": "#2c5fa0"}, {"chip": "Part 3 of 3", "title": "A bit about how you work", "desc": "Answer based on what you actually do, not what you 'should' do. There are no right answers.", "color": "#0D1B3D"}], "questions": [{"id": "d1", "sec": 0, "dim": "exec", "rev": false, "text": "I'd rather just start and figure it out as I go than plan every step."}, {"id": "e1", "sec": 0, "dim": "energy", "rev": false, "text": "I perform best working alone and uninterrupted."}, {"id": "i1", "sec": 0, "dim": "ideas", "rev": false, "text": "I prefer what I know works over experimenting."}, {"id": "r1", "sec": 0, "dim": "rel", "rev": false, "text": "I say what I think even if it's uncomfortable."}, {"id": "c1", "sec": 0, "dim": "dec", "rev": false, "text": "I trust my gut to decide, even when I can't fully explain it."}, {"id": "d2", "sec": 0, "dim": "exec", "rev": false, "text": "I adjust quickly when plans change at the last minute."}, {"id": "e2", "sec": 0, "dim": "energy", "rev": false, "text": "I need quiet and focus to do my best work."}, {"id": "i2", "sec": 0, "dim": "ideas", "rev": false, "text": "I focus on the concrete and practical, not abstract ideas."}, {"id": "r2", "sec": 0, "dim": "rel", "rev": false, "text": "I'd rather disagree openly than stay quiet to keep the peace."}, {"id": "c2", "sec": 0, "dim": "dec", "rev": false, "text": "I decide fast and adjust as I go."}, {"id": "d3", "sec": 1, "dim": "exec", "rev": false, "text": "I work better with freedom than with a defined process."}, {"id": "e3", "sec": 1, "dim": "energy", "rev": false, "text": "I'd rather send a well-thought-out message than hash it out in a meeting."}, {"id": "i3", "sec": 1, "dim": "ideas", "rev": false, "text": "If it isn't broken, I don't change it."}, {"id": "r3", "sec": 1, "dim": "rel", "rev": false, "text": "I don't struggle to give tough feedback when it's needed."}, {"id": "c3", "sec": 1, "dim": "dec", "rev": false, "text": "I often 'feel' the answer before I can back it up with data."}, {"id": "d4", "sec": 1, "dim": "exec", "rev": true, "text": "Before I start something, I like to have a clear, written plan."}, {"id": "e4", "sec": 1, "dim": "energy", "rev": true, "text": "My best ideas come from talking things through with other people."}, {"id": "i4", "sec": 1, "dim": "ideas", "rev": true, "text": "Routine bores me; I look for new ways to do things."}, {"id": "r4", "sec": 1, "dim": "rel", "rev": true, "text": "I'm careful with my wording so I don't hurt anyone."}, {"id": "c4", "sec": 1, "dim": "dec", "rev": true, "text": "I won't make an important decision without the data in front of me."}, {"id": "d5", "sec": 2, "dim": "exec", "rev": true, "text": "I make lists and I stick to them."}, {"id": "e5", "sec": 2, "dim": "energy", "rev": true, "text": "Group brainstorming energizes me."}, {"id": "i5", "sec": 2, "dim": "ideas", "rev": true, "text": "I enjoy exploring ideas even when they lead nowhere practical."}, {"id": "r5", "sec": 2, "dim": "rel", "rev": true, "text": "I'd rather give a little ground than create conflict."}, {"id": "c5", "sec": 2, "dim": "dec", "rev": true, "text": "I take my time comparing options before I choose."}, {"id": "d6", "sec": 2, "dim": "exec", "rev": true, "text": "Leaving things to the last minute makes me uncomfortable."}, {"id": "e6", "sec": 2, "dim": "energy", "rev": true, "text": "I'd rather sort things out in person or on a call than in writing."}, {"id": "i6", "sec": 2, "dim": "ideas", "rev": true, "text": "I'm usually one of the first to try something new."}, {"id": "r6", "sec": 2, "dim": "rel", "rev": true, "text": "I try to get everyone on board before deciding."}, {"id": "c6", "sec": 2, "dim": "dec", "rev": true, "text": "I distrust decisions based on hunches alone."}], "balanced": {"emoji": "🧩", "name": "The All-Rounder", "tag": "You switch registers depending on what the moment needs.", "desc": "You don't marry one style: you plan or improvise, talk or focus, whatever fits. Your profile came out even across every dimension.", "power": "Versatility. You adapt to different teams and situations without forcing it.", "blind": "A bit of everything can read as no clear stance. Don't let flexibility become an excuse to not commit."}};
const U=CFG.ui, DIMS=CFG.dims, SECS=CFG.sections, QS=CFG.questions;
const NQ=QS.length, NS=SECS.length;
let screen='welcome'; const answers={}; const app=document.getElementById('app');
function secQs(si){return QS.filter(q=>q.sec===si);}
function adj(q){const r=answers[q.id];return q.rev?(6-r):r;}
function dimScore(id){const qs=QS.filter(q=>q.dim===id);return qs.reduce((a,q)=>a+adj(q),0)/qs.length;}
function nAns(){return Object.keys(answers).length;}
function T(str,o){return str.replace(/\{(\w+)\}/g,(_,k)=>o[k]!=null?o[k]:'');}
function poleName(d,s){return s>=3?d.poleB:d.poleA;}
function strengthLbl(d,s){const dist=Math.abs(s-3);
 if(dist<CFG.bal_threshold)return U.bal_lbl;
 const p=poleName(d,s);
 return dist<CFG.strong_threshold?T(U.lean_lbl,{pole:p}):T(U.strong_lbl,{pole:p});}
function archOf(d,s){return s>=3?d.archB:d.archA;}
function topbar(step){const pct=screen==='results'?100:(screen==='welcome'?0:Math.round(nAns()/NQ*100));
 return `<div class="top"><span class="step">${step||''}</span></div>
 <div class="progress"><i style="width:${pct}%"></i></div>`;}
function render(){window.scrollTo(0,0);
 if(screen==='welcome')return welcome();
 if(screen==='results')return results();
 return section(screen);}
function welcome(){
 app.innerHTML=`${topbar('')}
 <div class="hero"><a href="https://www.absurdlyhuman.com" target="_blank" rel="noopener"><img src="${CFG.lockup}" alt="Absurdly Human"></a>
 <h1 class="brandfont">${U.hero_title}</h1>
 <div class="tag">${U.hero_tag}</div><p>${U.hero_p}</p>
 <div class="facts">${U.facts.map(f=>`<div class="fact">${f}</div>`).join('')}</div>
 <button class="btn btn-primary" onclick="go(0)">${U.start}</button>
 <div class="priv">${U.priv}</div></div>
 <div class="foot"><img class="smallmark" src="${CFG.mark}">${U.foot}</div>`;}
function section(si){const s=SECS[si];const qs=secQs(si);
 let h=topbar(T(U.sec_of,{n:si+1,t:NS}));
 h+=`<span class="pchip" style="background:${s.color}"><span class="pdot"></span>${s.chip}</span>`;
 h+=`<h2 class="ph">${s.title}</h2>`+(s.desc?`<p class="pdesc">${s.desc}</p>`:`<div style="height:6px"></div>`);
 h+=`<div class="card">`;
 qs.forEach(q=>{h+=`<div class="q" data-q="${q.id}"><p class="qtext">${q.text}</p><div class="scale">`;
  for(let v=1;v<=5;v++){h+=`<button class="opt${answers[q.id]===v?' sel':''}" onclick="pick('${q.id}',${v})">${v}</button>`;}
  h+=`</div><div class="scale-lbl"><span>${U.scale_lo}</span><span>${U.scale_hi}</span></div></div>`;});
 h+=`</div><div class="missing" id="miss">${T(U.miss,{k:qs.length})}</div>
 <div class="nav"><button class="btn btn-ghost" onclick="back()">${U.back}</button>
 <button class="btn btn-primary" onclick="next()">${si===NS-1?U.last_next:U.next}</button></div>`;
 app.innerHTML=h;}
function results(){
 const scored=DIMS.map(d=>{const s=dimScore(d.id);return {d,s,dist:Math.abs(s-3),poleB:s>=3};});
 const byDist=[...scored].sort((a,b)=>b.dist-a.dist);
 const top=byDist[0];
 let arch;
 if(top.dist<CFG.bal_threshold){arch=CFG.balanced;}else{arch=archOf(top.d,top.s);}
 window._focus=arch.name;
 let h=topbar(U.res_step);
 // archetype hero
 h+=`<div class="arch"><div class="kick">${U.arch_kick}</div>
  <div class="emoji">${arch.emoji}</div><div class="nm">${arch.name}</div>
  <div class="tag">${arch.tag}</div><div class="desc">${arch.desc}</div>
  <div class="twocol">
   <div class="pbox"><h4>${U.power_h}</h4><p>${arch.power}</p></div>
   <div class="pbox"><h4>${U.blind_h}</h4><p>${arch.blind}</p></div>
  </div></div>`;
 // secondary leaning
 const sec=byDist[1];
 if(sec && sec.dist>=CFG.bal_threshold){const sa=archOf(sec.d,sec.s);
  h+=`<div class="sec2"><div class="kick">${U.sec2_kick}</div>
   <div class="ln"><b>${sa.emoji} ${sa.name}</b> — ${sa.tag}</div></div>`;}
 // spectrum
 h+=`<div class="card"><h3 style="margin:2px 0 4px;font-size:18px">${U.spec_title}</h3>
  <p class="pdesc" style="margin:0 0 8px">${U.spec_sub}</p>`;
 scored.forEach(o=>{const pct=Math.round((o.s-1)/4*100);
  h+=`<div class="spec"><div class="ends"><span class="a">${o.d.poleA}</span><span class="b">${o.d.poleB}</span></div>
   <div class="rail"><div class="mid"></div><div class="dot" style="left:${pct}%"></div></div>
   <div class="lbl">${strengthLbl(o.d,o.s)} · ${o.s.toFixed(2)}/5</div></div>`;});
 h+=`</div>`;
 // radar
 h+=`<div class="card"><h3 style="margin:2px 0 4px;font-size:18px">${U.radar_title}</h3>
  <p class="pdesc" style="margin:0 0 6px">${U.radar_note}</p>
  <div class="radar-wrap"><canvas id="radar" height="300"></canvas></div></div>`;
 // cta + email
 h+=`<div class="reco"><div class="kick">${U.cta_kick}</div>
  <h3>${U.cta_h}</h3><p>${U.cta_p}</p>
  <div class="tkrow"><div><b style="font-size:17px">${U.cta_name}</b><br><span style="color:var(--muted);font-size:14px">${U.cta_desc}</span></div>
  <a class="btn btn-primary" href="${U.cta_link}" target="_blank" rel="noopener noreferrer" style="text-decoration:none;white-space:nowrap">${U.cta_btn}</a></div>
  <div class="email"><input id="mail" type="email" placeholder="${U.email_ph}">
  <button class="btn btn-ghost" onclick="capture()">${U.email_btn}</button></div>
  <div id="mailok" style="color:#1B6B3A;font-weight:600;font-size:14px;margin-top:8px;display:none"></div></div>`;
 h+=`<div class="teaser">${U.teaser}</div>
  <div class="nav" style="margin-top:22px"><button class="btn btn-ghost" onclick="restart()">${U.restart}</button><span></span></div>
  <div class="foot"><img class="smallmark" src="${CFG.mark}">${U.foot}</div>`;
 app.innerHTML=h; drawRadar(scored);}
function drawRadar(scored){if(!window.Chart)return;const el=document.getElementById('radar');if(!el)return;
 new Chart(el,{type:'radar',data:{labels:DIMS.map(d=>d.short),
  datasets:[{label:U.radar_label,data:scored.map(o=>o.s),
   fill:true,backgroundColor:'rgba(30,77,140,.15)',borderColor:'#1E4D8C',borderWidth:2,
   pointBackgroundColor:'#1E4D8C',pointRadius:3}]},
  options:{responsive:true,maintainAspectRatio:false,
   scales:{r:{min:1,max:5,ticks:{stepSize:1,display:false},pointLabels:{font:{size:11,family:'Inter'},color:'#0D1B3D'},
    grid:{color:'#e4e8f0'},angleLines:{color:'#e4e8f0'}}},plugins:{legend:{display:false}}}});}
function go(i){screen=i;render();}
function pick(qid,v){answers[qid]=v;const el=document.querySelector(`[data-q="${qid}"]`);
 if(el)el.querySelectorAll('.opt').forEach((b,i)=>b.classList.toggle('sel',i+1===v));
 const m=document.getElementById('miss');if(m)m.style.display='none';
 const pf=document.querySelector('.progress>i');if(pf)pf.style.width=Math.round(nAns()/NQ*100)+'%';}
function allAns(si){return secQs(si).every(q=>answers[q.id]!=null);}
function next(){const si=screen;
 if(!allAns(si)){const m=document.getElementById('miss');if(m)m.style.display='block';
  const f=secQs(si).find(q=>answers[q.id]==null);const el=document.querySelector(`[data-q="${f.id}"]`);
  if(el)el.scrollIntoView({behavior:'smooth',block:'center'});return;}
 screen=(si===NS-1)?'results':si+1;render();}
function back(){screen=(screen===0)?'welcome':screen-1;render();}
function restart(){for(const k in answers)delete answers[k];screen='welcome';render();}
function capture(){var m=document.getElementById('mail');var ok=document.getElementById('mailok');
 if(!m||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m.value)){return;}
 m.disabled=true;var btn=m.nextElementSibling;if(btn)btn.disabled=true;
 fetch('/api/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:m.value,source:CFG.source,focus:window._focus||''})})
 .then(function(r){ok.textContent=r.ok?U.email_ok:U.email_err;ok.style.color=r.ok?'#1B6B3A':'#922B21';ok.style.display='block';})
 .catch(function(){ok.textContent=U.email_err;ok.style.color='#922B21';ok.style.display='block';});}
render();
</script>
</body>
